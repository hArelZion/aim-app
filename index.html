<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIM</title>
<meta name="apple-mobile-web-app-title" content="AIM">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#262624">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=Noto+Serif+Hebrew:wght@400;600&display=swap">
<style>
/* Layout: a one-screen chat with Claude: slim header with live dot, flowing assistant text, user bubbles, composer docked below */
:root {
  --bg: #faf9f5; --surface: #ffffff; --ink: #1f1e1d; --muted: #75736c; --line: #e4e0d5; --bubble: #efebe1;
  --spark: #d97757; --accent: #c96442; --accent-ink: #ffffff; --code: #f1eee6; --live: #22a55a;
  --warn: #b3322b; --warn-soft: #fbe9e6;
  --font-ui: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-reply: "Noto Serif Hebrew", "IBM Plex Sans Hebrew", Georgia, serif;
  --font-mono: ui-monospace, Consolas, "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --surface: #30302e; --ink: #ece9e1; --muted: #a29f96; --line: #3e3d3a; --bubble: #141413;
    --accent: #d97757; --accent-ink: #1f1e1d; --code: #1c1c1a; --live: #3ccf78; --warn: #f08a83; --warn-soft: #3a1f1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --surface: #30302e; --ink: #ece9e1; --muted: #a29f96; --line: #3e3d3a; --bubble: #141413;
  --accent: #d97757; --accent-ink: #1f1e1d; --code: #1c1c1a; --live: #3ccf78; --warn: #f08a83; --warn-soft: #3a1f1e;
  color-scheme: dark;
}
:root[data-model="gpt"] { --spark: #3b82f6; --accent: #2563eb; }
:root[data-model="gemini"] { --bg: #ffffff; --surface: #f0f4f9; --line: #dde3ea; --bubble: #e9eef6; --spark: #4285f4; --accent: #0b57d0; --accent-ink: #ffffff; --code: #f0f4f9; }
@media (prefers-color-scheme: dark) {
  :root[data-model="gemini"]:not([data-theme="light"]) {
    --bg: #131314; --surface: #1e1f20; --line: #37393b; --bubble: #282a2c; --spark: #a8c7fa; --accent: #a8c7fa; --accent-ink: #062e6f; --code: #1e1f20;
  }
}
:root[data-model="gemini"][data-theme="dark"] {
  --bg: #131314; --surface: #1e1f20; --line: #37393b; --bubble: #282a2c; --spark: #a8c7fa; --accent: #a8c7fa; --accent-ink: #062e6f; --code: #1e1f20;
}
@media (prefers-color-scheme: dark) {
  :root[data-model="gpt"]:not([data-theme="light"]) {
    --bg: #000000; --surface: #111111; --line: #262626; --bubble: #1c1c1e; --accent: #3b82f6; --accent-ink: #ffffff; --code: #151515;
  }
}
:root[data-model="gpt"][data-theme="dark"] {
  --bg: #000000; --surface: #111111; --line: #262626; --bubble: #1c1c1e; --accent: #3b82f6; --accent-ink: #ffffff; --code: #151515;
}
.logo-btn { border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
.logo-btn:focus-visible { outline: 2px solid var(--spark); outline-offset: 3px; }
*, *::before, *::after { box-sizing: border-box; }
html { direction: ltr; }
html[dir="rtl"] { direction: rtl; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55;
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--spark); outline-offset: 2px; }
.wrap { width: 100%; max-width: 720px; margin-inline: auto; padding-inline: 16px; }
.logo { display: inline-grid; place-items: center; color: var(--spark); flex: none; }
.logo svg { width: 100%; height: 100%; display: block; }
.duo { position: relative; width: 100%; height: 100%; display: block; }
.duo > span { position: absolute; width: 66%; height: 66%; display: block; }
.duo > span:nth-child(1) { top: 0; inset-inline-start: 0; }
.duo > span:nth-child(2) { bottom: 0; inset-inline-end: 0; }
.duo.three > span { width: 58%; height: 58%; }
.duo.three > span:nth-child(2) { top: 0; bottom: auto; inset-inline-end: 0; }
.duo.three > span:nth-child(3) { bottom: 0; inset-inline-start: 21%; }
.duo svg { width: 100%; height: 100%; display: block; }
.target { display: flex; gap: 6px; align-items: center; padding: 6px 2px 8px; flex-wrap: wrap; max-height: 104px; overflow-y: auto; font-size: .78rem; color: var(--muted); }
.target button { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: var(--bg); color: var(--ink, inherit); border-radius: 999px; padding: 4px 10px 4px 8px; font: inherit; cursor: pointer; }
.target button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.target .logo { width: 16px; height: 16px; }
.members { display: grid; gap: 6px; margin-block: 8px 4px; max-height: 42vh; overflow-y: auto; }
.tiers { display: flex; gap: 6px; margin-block: 6px; }
.tiers button { flex: 1; border: 1px solid var(--line); background: var(--bg); color: inherit; border-radius: 10px; padding: 7px 4px; font: inherit; font-size: .82rem; cursor: pointer; }
.tiers button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; font-weight: 600; }
.pickall { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: .82rem; cursor: pointer; padding: 2px 0 6px; text-align: start; }
.members .sub { font-size: .72rem; color: var(--muted); margin-inline-start: 4px; }
.members label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.members .logo { width: 20px; height: 20px; }
.members input { margin-inline-start: auto; width: 18px; height: 18px; accent-color: var(--accent); }
.tochip { display: inline-flex; gap: 4px; align-items: center; font-size: .72rem; opacity: .75; margin-bottom: 2px; }
.tochip .logo { width: 12px; height: 12px; }
.who { font-size: .74rem; font-weight: 600; color: var(--muted); line-height: 1.2; margin-bottom: 2px; }
.agent { align-self: stretch; margin-block: 3px; border: 1px dashed var(--line); border-radius: 12px; padding: 6px 10px; font-size: .8rem; color: var(--muted); }
.agent summary { display: flex; gap: 8px; align-items: center; cursor: pointer; list-style: none; min-width: 0; }
.agent summary::-webkit-details-marker { display: none; }
.agent summary .logo { width: 16px; height: 16px; }
.agent summary b { font-weight: 600; flex: none; }
.agent summary .prev { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.agent[open] .prev { display: none; }
.tool { align-self: stretch; margin-block: 1px; font-size: .84rem; color: var(--muted); }
.tool summary { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; list-style: none; max-width: 100%; padding-block: 2px; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.tool summary::after { content: "\203A"; flex: none; transition: transform .15s; }
:root[dir="rtl"] .tool summary::after { transform: scaleX(-1); }
.tool[open] summary::after { transform: rotate(90deg); }
.tool .tbox { margin-top: 4px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); direction: ltr; text-align: left; }
.tool .tname { font-size: .74rem; font-weight: 600; margin-bottom: 4px; }
.tool pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: .74rem; line-height: 1.45; color: var(--ink); max-height: 340px; overflow: auto; }
.tool pre.out { background: none; border: 0; padding: 6px 0 0; color: var(--muted); }
.tool .dl { display: block; } .tool .dl.add { color: var(--live); } .tool .dl.del { color: var(--warn, #c0392b); }
.toolgrp { align-self: stretch; margin-block: 1px; font-size: .84rem; color: var(--muted); }
.toolgrp > summary { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; list-style: none; max-width: 100%; padding-block: 2px; }
.toolgrp > summary::-webkit-details-marker { display: none; }
.toolgrp > summary span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.toolgrp > summary::after { content: "\203A"; flex: none; transition: transform .15s; }
:root[dir="rtl"] .toolgrp > summary::after { transform: scaleX(-1); }
.toolgrp[open] > summary::after { transform: rotate(90deg); }
.toolgrp .tool { padding-inline-start: 12px; border-inline-start: 2px solid var(--line); }
.steprow { font-size: .82rem; color: var(--muted); display: flex; gap: 6px; min-width: 0; }
.steprow .st-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; direction: ltr; unicode-bidi: isolate; }
.steprow .st-time { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; }
.agent .agent-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; direction: ltr; text-align: start; }

/* login */
.login { flex: 1; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
.login-card { width: 100%; max-width: 360px; display: grid; gap: 14px; justify-items: center; text-align: center; }
.login-card .logo { width: 48px; height: 48px; }
.login-card h1 { margin: 0; font-size: 1.1rem; letter-spacing: .14em; color: var(--muted); }
.login-card p { margin: 0; color: var(--muted); font-size: .92rem; }
.field { width: 100%; height: 46px; padding-inline: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; direction: ltr; text-align: left; }
.btn-main { width: 100%; height: 46px; border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn-link { border: 0; background: none; color: var(--muted); text-decoration: underline; font-size: .88rem; }
.login-msg { font-size: .88rem; }
.login-msg.err { color: var(--warn); }

/* header */
header { flex: none; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.bar .logo { width: 28px; height: 28px; }
.who { display: grid; line-height: 1.25; min-width: 0; }
.who .name { font-weight: 600; font-size: 1.02rem; }
.sub { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); min-width: 0; }
.sub span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { position: relative; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; opacity: .6; }
.dot[data-s="live"] { background: var(--live); opacity: 1; }
.dot[data-s="live"]::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--live); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
.actions { margin-inline-start: auto; display: flex; gap: 2px; flex: none; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--muted); }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--bubble); color: var(--ink); }
.icon-btn svg { width: 21px; height: 21px; }
.sheet { border-top: 1px solid var(--line); background: var(--surface); max-height: 75vh; overflow-y: auto; }
.sheet-in { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; padding-block: 16px; text-align: center; }
.meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: .82rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.lang-label { font-size: .78rem; color: var(--muted); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 6px 16px; border-radius: 999px; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.btn-plain { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: .88rem; }
.btn-warn { padding: 7px 14px; border-radius: 9px; border: 1px solid var(--warn); background: transparent; color: var(--warn); font-weight: 600; font-size: .88rem; }
.convs { display: grid; gap: 4px; width: 100%; max-width: 480px; text-align: start; }
.conv { display: grid; gap: 2px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); width: 100%; text-align: start; }
.conv[aria-current="true"] { border-color: var(--spark); }
.convrow { display: flex; gap: 6px; align-items: stretch; }
.convrow .conv { flex: 1; min-width: 0; }
.convdel { flex: none; width: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
.convdel:hover { color: #d33; border-color: #d33; }
.convdel svg { width: 18px; height: 18px; }
.conv b { font-weight: 600; font-size: .95rem; }
.conv span { font-size: .78rem; color: var(--muted); }
.sheet h2 { margin: 0; font-size: .9rem; font-weight: 600; }
.oldbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-block: 8px 12px; padding: 10px 14px; border-radius: 16px; background: var(--bubble); font-size: .88rem; }
.oldbar button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: .85rem; }
.alert { padding: 8px 12px; margin-bottom: 10px; border-radius: 10px; font-size: .85rem; background: var(--warn-soft); color: var(--warn); }

/* thread */
main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.thread { display: flex; flex-direction: column; gap: 6px; padding-block: 20px 8px; }
.row { display: grid; gap: 3px; min-width: 0; }
.row.me { justify-items: start; margin-block: 10px 4px; }
.ububble { max-width: 85%; padding: 9px 14px; border-radius: 18px; background: var(--bubble); white-space: pre-wrap; overflow-wrap: anywhere; }
.ufoot { font-size: .72rem; color: var(--muted); padding-inline: 6px; }
.ufoot .read { color: var(--live); }
.row.ai { grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; align-items: start; }
.row.ai .logo { width: 22px; height: 22px; margin-top: 4px; }
.row.ai.cont .logo { visibility: hidden; }
.reply { font-family: var(--font-reply); font-size: 1.02rem; line-height: 1.75; overflow-wrap: anywhere; min-width: 0; }
.reply > :first-child { margin-top: 0; }
.reply > :last-child { margin-bottom: 0; }
.reply p { margin: 0 0 .7em; }
.reply ul, .reply ol { margin: 0 0 .7em; padding-inline-start: 1.3em; }
.reply li { margin-bottom: .25em; }
.reply h4 { margin: .9em 0 .4em; font-family: var(--font-ui); font-size: 1rem; font-weight: 600; }
.reply strong { font-weight: 600; }
.reply a { color: var(--accent); text-underline-offset: 2px; }
.reply code { font-family: var(--font-mono); font-size: .85em; background: var(--code); padding: .1em .35em; border-radius: 5px; direction: ltr; unicode-bidi: isolate; }
.reply pre { margin: 0 0 .7em; padding: 10px 12px; background: var(--code); border-radius: 10px; overflow-x: auto; direction: ltr; text-align: left; }
.reply pre code { background: none; padding: 0; font-size: .82rem; line-height: 1.5; }
.afoot { grid-column: 2; font-size: .72rem; color: var(--muted); }
.ai .pics { grid-column: 2; }
.sys { align-self: center; text-align: center; font-size: .78rem; color: var(--muted); padding: 6px 12px; margin-block: 8px; }
.pics { display: flex; flex-wrap: wrap; gap: 6px; max-width: 85%; }
.pics a { display: block; width: min(220px, 60vw); max-width: 100%; min-height: 80px; border-radius: 14px; overflow: hidden; background: var(--bubble); }
.pics img { width: 100%; height: auto; display: block; }
.tail { display: grid; gap: 10px; padding-block: 4px 24px; }
.thinking { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 10px; align-items: center; }
.thinking .logo { width: 22px; height: 22px; animation: spin 2.6s cubic-bezier(.5, 0, .5, 1) infinite; }
.think-txt { display: grid; line-height: 1.35; min-width: 0; }
.shimmer { font-weight: 500; width: fit-content; background: linear-gradient(90deg, var(--muted) 0%, var(--ink) 45%, var(--muted) 90%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.8s linear infinite; }
.activity { font-size: .82rem; color: var(--muted); }
.pending { justify-self: start; font-size: .78rem; color: var(--muted); padding-inline: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shine { from { background-position: 100% 0; } to { background-position: -120% 0; } }
.empty { margin-block: 12vh 0; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); }
.empty .logo { width: 44px; height: 44px; }
.empty .brand { font-size: .78rem; font-weight: 600; letter-spacing: .12em; }
.empty strong { font-family: var(--font-reply); font-size: 1.5rem; font-weight: 400; color: var(--ink); }
.empty p { margin: 0; max-width: 34ch; }

/* composer */
footer { flex: none; background: var(--bg); }
.previews { display: flex; gap: 8px; padding-top: 8px; overflow-x: auto; }
.thumb { position: relative; flex: none; width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--bubble); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-x { position: absolute; top: 3px; inset-inline-end: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgb(0 0 0 / .6); color: #fff; font-size: 15px; line-height: 1; display: grid; place-items: center; }
.box { display: flex; align-items: flex-end; gap: 8px; margin-block: 6px 12px; padding: 8px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: 0 1px 6px rgb(0 0 0 / .05); }
textarea { flex: 1; min-width: 0; resize: none; max-height: 38vh; min-height: 40px; border: 0; outline: 0; padding: 8px; background: transparent; color: var(--ink); font: inherit; line-height: 1.45; }
textarea:focus, textarea:focus-visible { outline: none; box-shadow: none; }
.attach { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center; background: transparent; color: var(--muted); }
.attach svg { width: 22px; height: 22px; }
.send { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.send svg { width: 18px; height: 18px; }
.send:disabled { opacity: .35; cursor: default; }
.send.stop { position: relative; border-radius: 50%; }
.send.stop::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--accent); animation: stopring 1.4s ease-out infinite; pointer-events: none; }
.send.stop svg { width: 16px; height: 16px; animation: pulse 1.4s ease-in-out infinite; }
.send.stopping, .send.stopping:disabled { opacity: .6; }
.send.stopping::after { animation-duration: .7s; }
@keyframes stopring { from { transform: scale(.85); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
.err { padding-bottom: 8px; font-size: .82rem; color: var(--warn); }
.screenview { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; display: flex; flex-direction: column; }
.screenview .sbar { display: flex; gap: 6px; align-items: center; padding: 8px 10px; background: #111; flex-wrap: wrap; }
.screenview .sbar button { border: 1px solid #333; background: #1c1c1e; color: #fff; border-radius: 10px; padding: 6px 10px; font: inherit; font-size: .85rem; cursor: pointer; }
.screenview .sbar .stop { background: #b3261e; border-color: #b3261e; }
.screenview .sbar .left { margin-inline-start: auto; font-size: .8rem; opacity: .8; }
.screenview .sview { flex: 1; overflow: auto; display: grid; align-items: start; justify-items: center; }
.screenview .sview img { width: 100%; height: auto; display: block; touch-action: pan-x pan-y pinch-zoom; user-select: none; -webkit-user-drag: none; }
.screenview .smsg { padding: 28px 20px; text-align: center; display: grid; gap: 14px; justify-items: center; max-width: 420px; margin: auto; line-height: 1.5; }
.screenview .smsg button, .screenview .smsg input { border-radius: 12px; font: inherit; padding: 10px 18px; }
.screenview .smsg button { border: 0; background: #fff; color: #000; cursor: pointer; font-weight: 600; }
.screenview .smsg input { border: 1px solid #444; background: #111; color: #fff; text-align: center; letter-spacing: .3em; width: 9em; }
.screenview .skbd { display: flex; gap: 6px; padding: 8px 10px; background: #111; }

.cx .cbox .dl, .fpanel .dl { display: block; padding: 0 10px; }

.cx .cbox .dl.add, .fpanel .dl.add { background: rgb(46 160 67 / .16); color: #5fd17a; }

.runrow.cxrun .cxi { flex: none; width: 22px; height: 22px; display: inline-grid; place-items: center; color: var(--muted); margin-inline-end: 12px; }
.runrow.cxrun .cxi svg { width: 21px; height: 21px; animation: cxbreathe 1.8s ease-in-out infinite; }
.runrow.cxrun .rr { font-size: 1.04rem; }
@keyframes cxbreathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
/* "N files changed +a -d" pill and the list of changed files */
.fchg { display: flex; justify-content: center; margin: 4px 0 6px; }
.fchg button { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font-size: .98rem; box-shadow: 0 2px 10px rgb(0 0 0 / .25); }
.fchg button[aria-expanded="true"] { background: var(--bubble); }

.fchg .badges b.add, .fpanel .badges b.add { color: #3fb950; font-weight: 500; } .fchg .badges b.del, .fpanel .badges b.del { color: #f85149; font-weight: 500; }

.fpanel details > summary { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; list-style: none; border-radius: 12px; min-width: 0; direction: ltr; }
.fpanel details > summary::-webkit-details-marker { display: none; }
.fpanel .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .95rem; }

/* composer: + and permissions on one side, model + effort and the round send / stop button on the other */
.box .shield { grid-area: sh; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; }
.box .shield svg { width: 22px; height: 22px; }

<script>
/* where this copy of AIM keeps its data: config.js (in your fork), or a setup link from your computer
   (?setup=... made by the installer), or the setup form below. The publishable key is public by design: row-level
   security locks the tables to your own account. */
const AIM_CFG = (() => {
  let c = Object.assign({}, window.AIM_CONFIG || {});
  try {
    const qs = new URLSearchParams(location.search), q = qs.get("setup");
    window.AIM_CONFIRMED = qs.has("confirmed");   // came back from the confirmation email
    if (q) {
      const d = JSON.parse(decodeURIComponent(escape(atob(q.replace(/-/g, "+").replace(/_/g, "/")))));
      if (d && /^https:\/\/[\w.-]+$/.test(d.url || "") && d.key) localStorage.setItem("aim-config", JSON.stringify({ supabaseUrl: d.url, supabaseKey: d.key }));
      history.replaceState(null, "", location.pathname + location.hash);   // keep #access_token for the sign-in
    }
    const saved = JSON.parse(localStorage.getItem("aim-config") || "null");
    if (saved && saved.supabaseUrl) c = Object.assign(c, saved);
  } catch (e) {}
  return c;
})();

function askModel(req) {

}
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderModelPick() {
  const box = $("mpick"); box.replaceChildren();
  if (model === "gpt") { renderGptPick(box, pickPart); return; }
  const cur = mpend && mpend.model ? mpend.model : mstate.model;
  box.append(el("div", "mhead", t("mModel")));
  const list = Array.isArray(mstate.models) && mstate.models.length ? mstate.models : [{ name: mstate.model }];
  list.forEach((m) => {
    const b = el("button", "mrow"); b.type = "button";
    const nm = el("span", "nm"), bi = document.createElement("bdi"); bi.textContent = m.name; nm.append(bi); b.append(nm);
    if (m.note === "credits") b.append(el("span", "note", t("mCredits")));

    const row = el("div", "row-btns"); row.style.justifyContent = "flex-start"; row.style.marginTop = "8px";
    const yes = el("button", "btn-plain", t("mYes")); yes.type = "button"; yes.onclick = () => askModel({ model: a.model, confirm: true });
    const no = el("button", "btn-plain", t("mNo")); no.type = "button"; no.onclick = () => { mmsg = null; renderModelPick(); };
    row.append(yes, no); q.append(row); box.append(q);

  else if (mstate.same === false) box.append(el("div", "mstat err", t("mOtherNow")));

function togglePick(part) {

  $("mchip").setAttribute("aria-expanded", String(open && part === "model")); $("permBtn").setAttribute("aria-expanded", String(open && part === "perm"));

$("mchip").onclick = (e) => { e.stopPropagation(); togglePick("model"); };
$("permBtn").onclick = (e) => { e.stopPropagation(); togglePick("perm"); };
document.addEventListener("click", (e) => { if (!$("mpick").hidden && e.target.isConnected && !e.target.closest("#mpick") && !e.target.closest("#mchip") && !e.target.closest("#permBtn")) { $("mpick").hidden = true; $("mchip").setAttribute("aria-expanded", "false"); $("permBtn").setAttribute("aria-expanded", "false"); document.querySelector("footer").classList.remove("mpicking"); } });
let slashSel = 0;
function slashItems() {
  const v = ta.value;
  if (model !== "claude" || !/^\/[\w:-]*$/.test(v)) return null;
  const q = v.slice(1).toLowerCase();
  const local = [{ name: "new", desc: t("cmdNew"), run: () => newChat() }, { name: "stop", desc: t("cmdStop"), run: () => sendStop() }];
  return local.concat(cmds).filter((c) => c.name.toLowerCase().includes(q)).slice(0, 30);
}
function renderSlash() {
  const box = $("slash"), items = slashItems();
  document.querySelector("footer").classList.toggle("slashing", !!(items && items.length));
  if (!items || !items.length) { box.hidden = true; box.replaceChildren(); return; }
  slashSel = Math.min(slashSel, items.length - 1);
  box.replaceChildren(...items.map((c, k) => {
    const b = el("button"); b.type = "button"; b.setAttribute("role", "option"); b.setAttribute("aria-selected", String(k === slashSel));
    b.append(el("b", null, "/" + c.name)); if (c.desc) b.append(el("span", null, c.desc));
    b.onmousedown = (e) => e.preventDefault();
    b.onclick = () => pickSlash(c);
    return b;
  }));
  box.hidden = false;
}
function pickSlash(c) {
  $("slash").hidden = true;
  if (c.run) { ta.value = ""; fit(); syncSend(); c.run(); return; }
  ta.value = "/" + c.name + " "; ta.focus(); fit(); syncSend();
}
ta.addEventListener("input", () => { slashSel = 0; renderSlash(); });
ta.addEventListener("blur", () => setTimeout(() => { $("slash").hidden = true; document.querySelector("footer").classList.remove("slashing"); }, 150));
ta.addEventListener("keydown", (e) => {
  const items = $("slash").hidden ? null : slashItems();
  if (!items || !items.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); slashSel = (slashSel + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length; renderSlash(); }
  else if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); e.stopImmediatePropagation(); pickSlash(items[slashSel]); }
  else if (e.key === "Escape") { $("slash").hidden = true; }
});
ta.addEventListener("input", () => { fit(); syncSend(); try { localStorage.setItem("aim-draft", ta.value); } catch (e) {} });
ta.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(hover: hover) and (pointer: fine)").matches) { e.preventDefault(); $("form").requestSubmit(); }
});
// Tapping the conversation (not the composer) closes the phone keyboard.
$("scroller").addEventListener("pointerdown", () => { if (document.activeElement === ta) ta.blur(); });

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  stopMic();
  if (stopMode()) { if (Date.now() - stopAt > 90000) sendStop(); return; }
  sendMsg(ta.value.trim(), picked.slice(), true);
});
async function sendMsg(text, pics, fromComposer) {
  if ((!text && !pics.length) || sending) return;
  if (model !== "claude" && !currentConv && !(await makeConv(model === "team" ? t("teamDefault") : (text || "").slice(0, 40) || t("newChat")))) return;   // every model starts its own chat on the first message
  sending = true; syncSend(); showErr("");
  const ts = Date.now();
  const id = "m" + ts.toString(36) + Math.random().toString(36).slice(2, 6);
  const row = { id, sender: "me", kind: "command", text: model === "team" ? "@" + target + "\n" + text : text, ts, seen: false };
  if (currentConv) row.conv = currentConv;
  const lastAi = [...msgs].reverse().find((m) => m.sender !== "me" && m.kind !== "system" && m.kind !== "tool");
  if (lastAi && lastAi.kind === "question" && !msgs.slice(msgs.indexOf(lastAi) + 1).some((m) => m.sender === "me")) { row.kind = "answer"; row.reply_to = lastAi.id; }
  const done = () => {
    if (!fromComposer) return;
    ta.value = ""; fit(); toBottom();
    pics.forEach((p) => { if (p.preview) URL.revokeObjectURL(p.preview); }); picked = []; renderPicked();
    try { localStorage.removeItem("aim-draft"); } catch (e2) {}
  };

    if (pics.length) {

        const nm = pics[i].preview && pics[i].name === "photo.jpg" ? i + ".jpg" : i + "-" + (pics[i].name || "file");
        const path = "me/" + id + "/" + nm;
        const { error } = await sb.storage.from(BUCKET).upload(path, pics[i].blob, { contentType: pics[i].blob.type || "application/octet-stream" });
        if (error) throw { pic: true };
        row.images.push(path);
      }
    }
    upsertMsg(Object.assign({ pending: true }, row)); renderThread(); renderTail();
    const { error } = await sb.from("messages").insert(row);
    if (error) throw error;
    upsertMsg(row);
    done();
  } catch (err) {
    if (!(err && err.pic) && isNetErr(err)) {   // no network: keep it and send later

  sending = false; syncSend(); renderThread(); renderTail();
}

/* ---------- light / dark ---------- */
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

/* ---------- sign in ---------- */
function loginMsg(s, isErr) { const m = $("loginMsg"); m.textContent = s; m.className = "login-msg" + (isErr ? " err" : ""); m.hidden = !s; }
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault(); loginMsg("");
  if (!$("email").value.trim() || !$("password").value) { loginMsg(t("loginErr"), true); return; }
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  if (error) loginMsg(t("loginErr"), true);
});
$("signUpBtn").onclick = async () => {
  const btn = $("signUpBtn"), email = $("email").value.trim();
  /* iPhone Safari doesn't show the browser's own "fill this in" bubbles, so say it here */

  btn.disabled = true; loginMsg(t("signUpSending"));
  /* the email link carries this page's setup, so it works even when it opens in another browser (Gmail's, say) */
  const setup = btoa(unescape(encodeURIComponent(JSON.stringify({ url: SUPABASE_URL, key: SUPABASE_KEY })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

  btn.disabled = false;

/* ---------- voice shortcut: ?say=text sends a message on its own (for "Hey Siri, Claude") ---------- */
const DEEP = (() => {
  try {
    const q = new URLSearchParams(location.search), say = (q.get("say") || "").trim();
    return say ? { say: say.slice(0, 2000), to: q.get("to"), speak: q.get("speak") !== "0" } : null;
  } catch (e) { return null; }
})();
let speakNext = false;
function speakText(text, id) {   // reads a reply aloud; long replies are read in sentence-sized pieces (iOS cuts long utterances)
  try {
    if (!window.speechSynthesis) return;
    const plain = String(text || "").replace(/```[\s\S]*?```/g, " ").replace(/https?:\/\/\S+/g, " ").replace(/[*_`#>\[\]]/g, "").replace(/\s+/g, " ").trim().slice(0, 4000);
    if (!plain) return;
    window.speechSynthesis.cancel();
    const he = /[֐-׿]/.test(plain);
    const parts = plain.match(/[^.!?\n]{1,220}([.!?]+|$)/g) || [plain];
    speakingId = id || null;
    parts.forEach((part, i) => {
      const u = new SpeechSynthesisUtterance(part.trim()); u.lang = he ? "he-IL" : t("locale") || lang;
      if (i === parts.length - 1) u.onend = u.onerror = () => { if (speakingId === (id || null)) { speakingId = null; renderThread(); } };
      window.speechSynthesis.speak(u);
    });

  } catch (e) {}
}

/* Android's back button (and the back swipe) closes the open sheet, panel or menu instead of leaving the app */
(function backLayer() {
  const ids = ["sheet", "convSheet", "screenView", "mpick", "fpanel", "menu"];
  let pushed = false, skip = false;
  const anyOpen = () => ids.some((id) => $(id) && !$(id).hidden);
  const closeAll = () => {
    closeSheets(); closeMenu(); if (scrOpen) closeScreen();
    $("mpick").hidden = true; $("mchip").setAttribute("aria-expanded", "false"); $("permBtn").setAttribute("aria-expanded", "false");
    document.querySelector("footer").classList.remove("mpicking");
    if (filesOpen) { filesOpen = false; renderFiles(); }

    if (anyOpen() && !pushed) { try { history.pushState({ aimLayer: 1 }, ""); pushed = true; } catch (e) {} }

  });
})();

}

}
